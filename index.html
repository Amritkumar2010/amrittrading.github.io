<!DOCTYPE html>
<html>
<head>
  <title>Amrit Paper Trading</title>
  <style>
    body { background:#0d1117; color:white; text-align:center; font-family:Arial; }
    input, select, button { padding:10px; margin:5px; border-radius:5px; border:none; }
    .buy{background:green;color:white;}
    .sell{background:red;color:white;}
    .card{background:#161b22;padding:15px;margin:10px;border-radius:10px;}
  </style>
</head>

<body>

<h1>📈 Amrit Paper Trading</h1>

<!-- LOGIN -->
<div id="loginBox">
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="card">
  <h3 id="balance">Balance: ₹0</h3>
  <h3 id="portfolio"></h3>
</div>

<select id="symbol" onchange="changeStock()">
  <option value="AAPL">Apple</option>
  <option value="TSLA">Tesla</option>
  <option value="MSFT">Microsoft</option>
</select>

<br>

<input type="number" id="qty" placeholder="Quantity"><br>

<button class="buy" onclick="buy()">BUY</button>
<button class="sell" onclick="sell()">SELL</button>

<h2 id="price">Price: Loading...</h2>

<h3>📜 Trade History</h3>
<div id="history"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

<script>
// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "PASTE",
  authDomain: "PASTE",
  projectId: "PASTE"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userId="";
let balance=0;
let portfolio={}; // multiple stocks
let price=0;
let currentSymbol="AAPL";

// AUTH
function signup(){
  auth.createUserWithEmailAndPassword(email(), pass())
  .then(u=>{
    userId=u.user.uid;
    db.collection("users").doc(userId).set({
      balance:100000,
      portfolio:{}
    });
    alert("Signup done");
  });
}

function login(){
  auth.signInWithEmailAndPassword(email(), pass())
  .then(u=>{
    userId=u.user.uid;
    showApp();
    loadData();
    loadHistory();
  });
}

function email(){ return document.getElementById("email").value; }
function pass(){ return document.getElementById("password").value; }

// SHOW
function showApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";
}

// DATA
function loadData(){
  db.collection("users").doc(userId).get().then(doc=>{
    let d=doc.data();
    balance=d.balance;
    portfolio=d.portfolio || {};
    update();
  });
}

function saveData(){
  db.collection("users").doc(userId).set({
    balance, portfolio
  });
}

// UPDATE UI
function update(){
  document.getElementById("balance").innerText="Balance: ₹"+balance;

  let text="";
  for(let s in portfolio){
    text += s + ": " + portfolio[s] + " | ";
  }
  document.getElementById("portfolio").innerText=text || "No stocks";
}

// BUY
function buy(){
  let qty=Number(document.getElementById("qty").value);
  if(qty<=0) return alert("Enter qty");

  let total=qty*price;

  if(balance>=total){
    balance-=total;
    portfolio[currentSymbol]=(portfolio[currentSymbol]||0)+qty;
    update();
    saveData();
    addHistory("BUY",qty);
  } else alert("No balance");
}

// SELL
function sell(){
  let qty=Number(document.getElementById("qty").value);
  if(qty<=0) return alert("Enter qty");

  if((portfolio[currentSymbol]||0)>=qty){
    balance+=qty*price;
    portfolio[currentSymbol]-=qty;
    update();
    saveData();
    addHistory("SELL",qty);
  } else alert("No stock");
}

// HISTORY
function addHistory(type,qty){
  db.collection("users").doc(userId)
  .collection("history").add({
    type,qty,price,symbol:currentSymbol,time:new Date()
  });
}

function loadHistory(){
  db.collection("users").doc(userId)
  .collection("history").orderBy("time","desc")
  .onSnapshot(snap=>{
    let html="";
    snap.forEach(doc=>{
      let d=doc.data();
      html+=`<p>${d.type} ${d.qty} ${d.symbol} @ ₹${d.price}</p>`;
    });
    document.getElementById("history").innerHTML=html;
  });
}

// STOCK CHANGE
function changeStock(){
  currentSymbol=document.getElementById("symbol").value;
  getPrice();
}

// REAL PRICE
function getPrice(){
  fetch("https://finnhub.io/api/v1/quote?symbol="+currentSymbol+"&token=d6vvjq9r01qjh1odm3sgd6vvjq9r01qjh1odm3t0")
  .then(r=>r.json())
  .then(d=>{
    if(d && d.c){
      price=d.c;
      document.getElementById("price").innerText=currentSymbol+" ₹"+price;
    }
  });
}

setInterval(getPrice,5000);

</script>

</body>
</html>
