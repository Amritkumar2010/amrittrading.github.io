

<!DOCTYPE html>
<html>
<head>
<title>Amrit Ultimate Trading App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d1117;
  color:white;
  display:flex;
}
.sidebar{
  width:260px;
  background:#161b22;
  padding:10px;
}
.main{
  flex:1;
  padding:10px;
}
input,button,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
}
button{cursor:pointer}
.buy{background:green;color:white}
.sell{background:red;color:white}
</style>

</head>

<body>

<div class="sidebar">

<h2>🚀 Paper Trading</h2>

<!-- SEARCH -->
<input id="search" placeholder="Search (AAPL, TSLA, BTCUSDT)">
<button onclick="loadStock()">Search</button>

<!-- DROPDOWN -->
<select onchange="quickSelect(this.value)">
<option value="AAPL">Apple</option>
<option value="TSLA">Tesla</option>
<option value="MSFT">Microsoft</option>
<option value="RELIANCE">Reliance</option>
<option value="TCS">TCS</option>
<option value="BTCUSDT">Bitcoin</option>
</select>

<input type="number" id="qty" placeholder="Quantity">
<input type="number" id="sl" placeholder="Stop Loss">

<button class="buy" onclick="buy()">BUY</button>
<button class="sell" onclick="sell()">SELL</button>

<h3 id="balance">Balance ₹100000</h3>
<h3 id="pl">P/L ₹0</h3>

</div>

<div class="main">
<h2 id="price">Loading...</h2>
<div id="chart"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// ===== GLOBAL =====
let balance = 100000;
let stock = 0;
let avgPrice = 0;
let price = 100;
let symbol = "AAPL";
let stopLoss = 0;

// ===== LOAD CHART =====
function loadChart(){
  document.getElementById("chart").innerHTML="";
  new TradingView.widget({
    container_id:"chart",
    width:"100%",
    height:400,
    symbol:"NASDAQ:"+symbol,
    theme:"dark"
  });
}
loadChart();

// ===== SEARCH STOCK =====
function loadStock(){
  let s = document.getElementById("search").value.toUpperCase();
  if(!s) return;

  symbol = s;
  loadChart();
}

// ===== DROPDOWN =====
function quickSelect(s){
  symbol = s;
  loadChart();
}

// ===== PRICE ENGINE =====
function getPrice(){
  let move = (Math.random() - 0.5) * 20;
  price = Number(price) + move;
  price = price.toFixed(2);

  document.getElementById("price").innerText =
    symbol + " ₹" + price;

  updatePL();
  checkSL();
}

// ===== BUY =====
function buy(){
  let qty = Number(document.getElementById("qty").value);
  let sl = Number(document.getElementById("sl").value);

  if(qty <= 0) return alert("Enter valid quantity");

  let cost = qty * price;

  if(balance >= cost){
    balance -= cost;

    avgPrice = ((avgPrice * stock) + (price * qty)) / (stock + qty);

    stock += qty;
    stopLoss = sl;

    flash("green");
    update();
  } else {
    alert("Not enough balance");
  }
}

// ===== SELL =====
function sell(){
  let qty = Number(document.getElementById("qty").value);

  if(qty <= 0) return alert("Enter valid quantity");

  if(stock >= qty){
    balance += qty * price;
    stock -= qty;

    flash("red");
    update();
  } else {
    alert("Not enough stock");
  }
}

// ===== STOP LOSS =====
function checkSL(){
  if(stock > 0 && stopLoss > 0 && price <= stopLoss){
    balance += stock * price;
    stock = 0;

    alert("Stop Loss Hit 🚨");
    update();
  }
}

// ===== UPDATE UI =====
function update(){
  document.getElementById("balance").innerText =
    "Balance ₹" + balance.toFixed(2);

  updatePL();
}

// ===== P/L =====
function updatePL(){
  let pl = (price - avgPrice) * stock;
  document.getElementById("pl").innerText =
    "P/L ₹" + pl.toFixed(2);
}

// ===== FLASH EFFECT =====
function flash(color){
  document.body.style.background = color;
  setTimeout(()=>{
    document.body.style.background = "#0d1117";
  },150);
}

// ===== AUTO RUN =====
setInterval(getPrice, 1000);
getPrice();

</script>

</body>
</html>
