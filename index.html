<!DOCTYPE html>
<html>
<head>
  <title>Amrit Trading</title>
</head>

<body style="background:black; color:white; text-align:center;">

<h1>Amrit Trading</h1>
<p>Practice Trading Without Risk</p>

<h3 id="balance">Balance: ₹100000</h3>

<input type="number" id="qty" placeholder="Quantity">
<br><br>

<button onclick="buy()" style="background:green; color:white;">BUY</button>
<button onclick="sell()" style="background:red; color:white;">SELL</button>

<h3 id="price">Price: ₹100</h3>

<div id="chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  "width": "100%",
  "height": 400,
  "symbol": "NASDAQ:AAPL",
  "theme": "dark"
});

let balance = 100000;
let price = 100;
let stock = 0;

function update() {
  document.getElementById("balance").innerText = "Balance: ₹" + balance;
}

function buy() {
  let qty = document.getElementById("qty").value;
  let total = qty * price;

  if(balance >= total){
    balance -= total;
    stock += Number(qty);
    update();
  } else {
    alert("Not enough balance");
  }
}

function sell() {
  let qty = document.getElementById("qty").value;

  if(stock >= qty){
    balance += qty * price;
    stock -= Number(qty);
    update();
  } else {
    alert("Not enough stock");
  }
}function getPrice(){
  fetch("https://finnhub.io/api/v1/quote?symbol=AAPL&token=d6vvjq9r01qjh1odm3sgd6vvjq9r01qjh1odm3t0")
  .then(res => res.json())
  .then(data => {
    if(data && data.c){
      price = data.c;
      document.getElementById("price").innerText = "Price: ₹" + price;
    }
  });
}

setInterval(getPrice, 5000);
getPrice();
</script>
</body>
</html>
