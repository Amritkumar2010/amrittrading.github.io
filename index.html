<!DOCTYPE html>
<html>
<head>
<title>Pro Paper Trading App</title>

<style>
body{margin:0;font-family:Arial;background:#0d1117;color:white;display:flex}
.sidebar{width:260px;background:#161b22;padding:10px}
.main{flex:1;padding:10px}
h2,h3{margin:5px 0}
input,button,select{width:100%;padding:10px;margin:5px 0;border:none}
button{cursor:pointer}
.buy{background:green;color:white}
.sell{background:red;color:white}
</style>
</head>

<body>

<div class="sidebar">

<h2>🚀 Paper Trading</h2>

<select id="symbol" onchange="changeSymbol()">
<option value="AAPL">Apple</option>
<option value="TSLA">Tesla</option>
<option value="BTCUSDT">Bitcoin</option>
</select>

<input id="qty" placeholder="Quantity">
<input id="sl" placeholder="Stop Loss">

<button class="buy" onclick="buy()">BUY</button>
<button class="sell" onclick="sell()">SELL</button>

<h3 id="balance">Balance ₹100000</h3>
<h3 id="pl">P/L ₹0</h3>

</div>

<div class="main">
<h2 id="price">Loading...</h2>
<div id="chart"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// GLOBAL
let balance=100000;
let stock=0;
let avgPrice=0;
let price=100;
let symbol="AAPL";
let stopLoss=0;

// CHART
function loadChart(){
document.getElementById("chart").innerHTML="";
new TradingView.widget({
container_id:"chart",
width:"100%",
height:400,
symbol:"BINANCE:BTCUSDT",
theme:"dark"
});
}
loadChart();

// SYMBOL CHANGE
function changeSymbol(){
symbol=document.getElementById("symbol").value;
loadChart();
}

// PRICE ENGINE (FAST + REAL FEEL)
function getPrice(){
let move=(Math.random()-0.5)*20;
price=(Number(price)+move).toFixed(2);

document.getElementById("price").innerText=symbol+" ₹"+price;

updatePL();
checkSL();
}

// BUY
function buy(){
let qty=Number(document.getElementById("qty").value);
let sl=Number(document.getElementById("sl").value);

let cost=qty*price;

if(balance>=cost){
balance-=cost;

// avg price calc
avgPrice=((avgPrice*stock)+(price*qty))/(stock+qty);

stock+=qty;
stopLoss=sl;

flash("green");
update();
}
}

// SELL
function sell(){
let qty=Number(document.getElementById("qty").value);

if(stock>=qty){
balance+=qty*price;
stock-=qty;

flash("red");
update();
}
}

// STOP LOSS
function checkSL(){
if(stock>0 && stopLoss>0 && price<=stopLoss){
balance+=stock*price;
stock=0;
alert("Stop Loss Hit 🚨");

update();
}
}

// UPDATE UI
function update(){
document.getElementById("balance").innerText="Balance ₹"+balance;
updatePL();
}

// P/L
function updatePL(){
let pl=(price-avgPrice)*stock;
document.getElementById("pl").innerText="P/L ₹"+pl.toFixed(2);
}

// FLASH EFFECT
function flash(color){
document.body.style.background=color;
setTimeout(()=>document.body.style.background="#0d1117",150);
}

// SPEED
setInterval(getPrice,1000);

</script>

</body>
</html>
