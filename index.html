<!DOCTYPE html>
<html>
<head>
  <title>Amrit Trading</title>
</head>

<body style="background:black; color:white; text-align:center; font-family:sans-serif;">

<h1>📈 Amrit Trading</h1>
<p>Practice Trading Without Risk</p>

<h3 id="balance">Balance: ₹100000</h3>
<h3 id="stock">Stock: 0</h3>

<input type="number" id="qty" placeholder="Quantity">
<br><br>

<button onclick="buy()" style="background:green; color:white; padding:10px;">BUY</button>
<button onclick="sell()" style="background:red; color:white; padding:10px;">SELL</button>

<h3 id="price">Price: Loading...</h3>

<div id="chart"></div>

<!-- TradingView -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
  "width": "100%",
  "height": 400,
  "symbol": "NASDAQ:AAPL",
  "theme": "dark"
});

// Data
let balance = 100000;
let price = 0;
let stock = 0;

// Update UI
function update() {
  document.getElementById("balance").innerText = "Balance: ₹" + balance;
  document.getElementById("stock").innerText = "Stock: " + stock;
}

// BUY
function buy() {
  let qty = Number(document.getElementById("qty").value);
  let total = qty * price;

  if(balance >= total && qty > 0){
    balance -= total;
    stock += qty;
    update();
  } else {
    alert("❌ Not enough balance");
  }
}

// SELL
function sell() {
  let qty = Number(document.getElementById("qty").value);

  if(stock >= qty && qty > 0){
    balance += qty * price;
    stock -= qty;
    update();
  } else {
    alert("❌ Not enough stock");
  }
}

// 🔥 LIVE PRICE (Finnhub API)
function getPrice(){
  fetch("https://finnhub.io/api/v1/quote?symbol=AAPL&token=d6vvjq9r01qjh1odm3sgd6vvjq9r01qjh1odm3t0")
  .then(res => res.json())
  .then(data => {
    if(data && data.c){
      price = data.c;
      document.getElementById("price").innerText = "Price: ₹" + price;
    } else {
      document.getElementById("price").innerText = "Price load error";
    }
  })
  .catch(() => {
    document.getElementById("price").innerText = "API Error";
  });
}

// Refresh every 5 sec
setInterval(getPrice, 5000);
getPrice();
</script>

</body>
</html>
