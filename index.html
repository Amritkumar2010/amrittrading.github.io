<!DOCTYPE html>
<html>
<head>
  <title>Amrit GOD LEVEL Trading</title>

  <style>
    body{margin:0;font-family:Arial;background:#0d1117;color:white;text-align:center;}
    header{background:#161b22;padding:15px;font-size:22px;}
    .card{background:#161b22;margin:10px;padding:15px;border-radius:10px;}
    button{padding:10px;margin:5px;border:none;border-radius:5px;}
    .buy{background:green;color:white;}
    .sell{background:red;color:white;}
    input,select{padding:10px;margin:5px;}
  </style>
</head>

<body>

<header>🔥 Amrit GOD LEVEL Trading</header>

<div class="card">
<h3 id="balance"></h3>
<h3 id="pl"></h3>
<h3 id="signal"></h3>
</div>

<select id="symbol" onchange="changeSymbol()">
  <option value="AAPL">Apple</option>
  <option value="TSLA">Tesla</option>
  <option value="BTCUSDT">Bitcoin</option>
</select>

<br>

<input type="number" id="qty" placeholder="Quantity">
<input type="number" id="sl" placeholder="Stop Loss">
<input type="number" id="tp" placeholder="Take Profit">

<br>

<button class="buy" onclick="buy()">BUY</button>
<button class="sell" onclick="sell()">SELL</button>

<h2 id="price">Loading...</h2>

<div id="chart"></div>

<h3>📜 History</h3>
<div id="history"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// STORAGE
let balance=localStorage.getItem("balance")||100000;
let portfolio=JSON.parse(localStorage.getItem("portfolio")||"{}");
let avgPrice=JSON.parse(localStorage.getItem("avgPrice")||"{}");
let stopLoss=JSON.parse(localStorage.getItem("sl")||"{}");
let takeProfit=JSON.parse(localStorage.getItem("tp")||"{}");

let price=0;
let symbol="AAPL";

// SAVE
function save(){
  localStorage.setItem("balance",balance);
  localStorage.setItem("portfolio",JSON.stringify(portfolio));
  localStorage.setItem("avgPrice",JSON.stringify(avgPrice));
  localStorage.setItem("sl",JSON.stringify(stopLoss));
  localStorage.setItem("tp",JSON.stringify(takeProfit));
}

// CHART
function loadChart(){
  document.getElementById("chart").innerHTML="";
  new TradingView.widget({
    "container_id":"chart",
    "width":"100%",
    "height":400,
    "symbol":"NASDAQ:"+symbol,
    "theme":"dark"
  });
}
loadChart();

// SYMBOL
function changeSymbol(){
  symbol=document.getElementById("symbol").value;
  loadChart();
  getPrice();
}

// UPDATE
function update(){
  document.getElementById("balance").innerText="Balance: ₹"+balance;
  updatePL();
}

// BUY
function buy(){
  let qty=Number(document.getElementById("qty").value);
  let sl=Number(document.getElementById("sl").value);
  let tp=Number(document.getElementById("tp").value);

  if(qty<=0) return alert("Enter qty");

  let total=qty*price;

  if(balance>=total){
    let oldQty=portfolio[symbol]||0;
    let oldAvg=avgPrice[symbol]||0;

    let newQty=oldQty+qty;
    avgPrice[symbol]=((oldQty*oldAvg)+total)/newQty;

    portfolio[symbol]=newQty;
    stopLoss[symbol]=sl;
    takeProfit[symbol]=tp;

    balance-=total;

    addHistory("BUY",qty);
    save();
    update();
  } else alert("No balance");
}

// SELL
function sell(){
  let qty=Number(document.getElementById("qty").value);

  if((portfolio[symbol]||0)>=qty){
    balance+=qty*price;
    portfolio[symbol]-=qty;

    addHistory("SELL",qty);
    save();
    update();
  } else alert("No stock");
}

// AUTO SL + TP
function checkSLTP(){
  let qty=portfolio[symbol]||0;
  let sl=stopLoss[symbol];
  let tp=takeProfit[symbol];

  if(qty>0){
    if(sl && price<=sl){
      balance+=qty*price;
      portfolio[symbol]=0;
      addHistory("STOP LOSS HIT",qty);
      alert("🛑 Stop Loss Triggered");
    }

    if(tp && price>=tp){
      balance+=qty*price;
      portfolio[symbol]=0;
      addHistory("TAKE PROFIT HIT",qty);
      alert("🎯 Target Hit");
    }

    save();
    update();
  }
}

// HISTORY
function addHistory(type,qty){
  let div=document.getElementById("history");
  div.innerHTML=`<p>${type} ${qty} ${symbol} @ ₹${price}</p>`+div.innerHTML;
}

// P/L
function updatePL(){
  let qty=portfolio[symbol]||0;
  let avg=avgPrice[symbol]||0;

  let pl=(price-avg)*qty;
  document.getElementById("pl").innerText="P/L: ₹"+pl.toFixed(2);
}

// AI
function aiSignal(){
  let avg=avgPrice[symbol]||price;
  let signal="HOLD";

  if(price>avg) signal="SELL 🔴";
  else if(price<avg) signal="BUY 🟢";

  document.getElementById("signal").innerText="AI Signal: "+signal;
}

// PRICE
function getPrice(){
  fetch("https://finnhub.io/api/v1/quote?symbol="+symbol+"&token=d6vvjq9r01qjh1odm3sgd6vvjq9r01qjh1odm3t0")
  .then(r=>r.json())
  .then(d=>{
    if(d && d.c){
      price=d.c;
      document.getElementById("price").innerText=symbol+" ₹"+price;

      updatePL();
      aiSignal();
      checkSLTP();
    }
  });
}

setInterval(getPrice,5000);
getPrice();
update();

</script>

</body>
</html>
